name: CI

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - uses: pnpm/setup@v3
              name: Install pnpm
              with:
                  cache: true

            - name: Run Typecheck
              run: |
                  pnpm run typecheck

    lint:
        name: Lint
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - uses: pnpm/setup@v3
              name: Install pnpm
              with:
                  cache: true

            - name: Run Lint
              run: |
                  pnpm run lint

    discover:
        name: Discover Days
        runs-on: ubuntu-latest
        outputs:
            years: ${{ steps.set-matrix.outputs.years }}
            matrix: ${{ steps.set-matrix.outputs.matrix }}

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Build matrix of days grouped by year
              id: set-matrix
              run: |
                  node -e '
                    const fs = require("node:fs");
                    const path = require("node:path");
                    const root = "solutions";
                    const byYear = {};
                    for (const year of fs.readdirSync(root)) {
                      const yearPath = path.join(root, year);
                      if (!fs.statSync(yearPath).isDirectory()) continue;
                      const days = fs.readdirSync(yearPath)
                        .filter((day) => fs.existsSync(path.join(yearPath, day, "index.ts")))
                        .sort((a, b) => Number(a) - Number(b));
                      if (days.length > 0) byYear[year] = days;
                    }
                    fs.writeFileSync("matrix.json", JSON.stringify(byYear));
                  '
                  matrix=$(cat matrix.json)
                  years=$(node -e 'console.log(JSON.stringify(Object.keys(require("./matrix.json"))))')
                  echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
                  echo "years=$years" >> "$GITHUB_OUTPUT"
                  rm matrix.json

    # Each year is dispatched as its own call to the reusable test-year.yml
    # workflow, so GitHub groups every year's days into its own collapsible
    # section automatically — no manual job needed when a new year is added.
    test:
        name: Year ${{ matrix.year }}
        needs: discover
        strategy:
            fail-fast: false
            matrix:
                year: ${{ fromJson(needs.discover.outputs.years) }}
        uses: ./.github/workflows/test-year.yml
        with:
            year: ${{ matrix.year }}
            days: ${{ toJson(fromJson(needs.discover.outputs.matrix)[matrix.year]) }}
